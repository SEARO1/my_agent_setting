ui-onboarding:
  welcomeNoticeVersion: 2026-08-13.1
locale:
  preference: en
agent-presets:
  default: ptc
llm-pi-ai:
  providers:
    opencode-go:
      apiKeyEnv: OPENCODE_GO_API_KEY
      models:
        - id: minimax-m3
          name: MiniMax-M3
          contextWindow: 1000000
          maxTokens: 131072
        - id: qwen3.7-max
          name: Qwen3.7 Max
          contextWindow: 1000000
          maxTokens: 65536
        - id: qwen3.7-plus
          name: Qwen3.7 Plus
          contextWindow: 1000000
          maxTokens: 65536
        - id: deepseek-v4-flash
          name: DeepSeek V4 Flash
          contextWindow: 1000000
          maxTokens: 384000
        - id: deepseek-v4-pro
          name: DeepSeek V4 Pro
          contextWindow: 1000000
          maxTokens: 384000
        - id: glm-5.1
          name: GLM-5.1
          contextWindow: 202752
          maxTokens: 32768
        - id: glm-5.2
          name: GLM-5.2
          contextWindow: 1000000
          maxTokens: 131072
        - id: hy3
          name: Hy3
          contextWindow: 256000
          maxTokens: 64000
        - id: kimi-k2.6
          name: Kimi K2.6
          contextWindow: 262144
          maxTokens: 65536
        - id: kimi-k2.7-code
          name: Kimi K2.7 Code
          contextWindow: 262144
          maxTokens: 262144
        - id: kimi-k3
          name: Kimi K3 (2x usage)
          contextWindow: 1048576
          maxTokens: 131072
        - id: mimo-v2.5
          name: MiMo V2.5
          contextWindow: 1000000
          maxTokens: 128000
        - id: mimo-v2.5-pro
          name: MiMo V2.5 Pro
          contextWindow: 1048576
          maxTokens: 128000
        - id: minimax-m2.7
          name: MiniMax-M2.7
          contextWindow: 204800
          maxTokens: 131072
        - id: qwen3.6-plus
          name: Qwen3.6 Plus
          contextWindow: 1000000
          maxTokens: 65536
        # Disabled for alpha: grok-4.5 is absent from the installed catalog.
        # - id: grok-4.5
        #   name: Grok 4.5
        #   contextWindow: 500000
        #   maxTokens: 500000

    poe:
      apiKeyEnv: POE_API_KEY
      api: openai-completions
      baseURL: "https://api.poe.com/v1"
      models:
        - id: GPT-5.6-Sol
        - id: GPT-5.6-Terra
        - id: GPT-5.6-Luna
        - id: deepseek-vision-exp
          name: DeepSeek-Vision-Exp
          contextWindow: 1000000
          maxTokens: 384000
          reasoningEfforts:
            off: null # POE 係咪真係接受 "off" 唔確定，null 代表「唔送」
            high: high
            max: max
          compat:
            thinkingFormat: deepseek # DeepSeek 系 API 用 thinking:{type} + reasoning_effort
            supportsReasoningEffort: true
        - id: deepseek-v4-pro
          name: DeepSeek-V4-Pro
          contextWindow: 1000000
          maxTokens: 384000
          reasoningEfforts:
            off: null # POE 係咪真係接受 "off" 唔確定，null 代表「唔送」
            high: high
            max: max
          compat:
            thinkingFormat: deepseek # DeepSeek 系 API 用 thinking:{type} + reasoning_effort
            supportsReasoningEffort: true
        - id: deepseek-v4-flash
          name: DeepSeek-V4-Flash
          contextWindow: 1000000
          maxTokens: 384000
          reasoningEfforts:
            off: null # POE 係咪真係接受 "off" 唔確定，null 代表「唔送」
            high: high
            max: max
          compat:
            thinkingFormat: deepseek # DeepSeek 系 API 用 thinking:{type} + reasoning_effort
            supportsReasoningEffort: true

    azure-openai-responses:
      apiKeyEnv: AZURE_OPENAI_API_KEY
      baseURL: "https://veserveazureai.openai.azure.com/"
      displayName: Azure GPT-5.6
      models:
        - id: gpt-5.6-sol
          name: GPT-5.6 Sol
          contextWindow: 1000000
          maxTokens: 128000

agent-default-model:
  provider: deepseek-official
  model: deepseek-flash
  reasoningEffort: max

ui-conversation:
  busyEnter: steer

ui-theme:
  preference: dark

dsh-dafeiyu:
  scale: 1
  activityLevel: lively
  includeSubagents: true
  soundEnabled: false

vision-router:
  onboardingSeen: true
  providers:
    - provider: opencode-go
      model: qwen3.7-plus
llm-deepseek:
  models:
    - id: deepseek-flash
      name: DeepSeek-V4.1-Flash
      description: Fast, efficient, and economical; suited to focused, routine, or
        parallel tasks.
      contextWindow: 1000000
      inputModalities:
        - text
        - image
      imagePixelBudget: 640000
      imageMaxBytes: 1048576
    - id: deepseek-v4-pro
      name: DeepSeek-V4-Pro
      description: Stronger agentic coding, knowledge, and difficult reasoning; suited
        to complex or quality-critical tasks at higher cost.
      contextWindow: 1000000
      inputModalities:
        - text
