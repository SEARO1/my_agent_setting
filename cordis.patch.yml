# Your patch layer for this dsh profile, applied after every bundle layer:
# a top-level YAML array of loader patch entries (id-targeted config
# overrides, disables, and insert lists; `!!js` expressions allowed).

# Enable session full-text search (FTS) in the Web UI sidebar.
# openAt: first-search defers SQLite until the first search; path is the
# durable FTS index (must NOT be the session-persistence database).
- id: session-query-sqlite
  config:
    path: 'C:\Users\cheun\.dsh\storages\session-fts.sqlite'
    openAt: first-search

# Knowledge base MCP server: REMOVED - MIGRATED to OpenViking (2026-08-22).
# Old KB files + mcp-server kept in place (not deleted). Use mcp__openviking__* tools instead.

# Cross-session awareness MCP server (2026-09-12): a DSH session can see what the other
# sessions on this machine are doing (peers / session_detail / announce / board / whoami).
# Source: C:\Users\cheun\OneDrive\Desktop\agent_cross-session_mcp (reads session logs read-only).
# serverName must stay 'crosssession' - caller identification matches mcp__crosssession__* records.
- insert:
    - id: mcp-cross-session
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: crosssession
        transport: stdio
        command: node
        args: ['C:\Users\cheun\OneDrive\Desktop\agent_cross-session_mcp\server.mjs']
        cwd: 'C:\Users\cheun\OneDrive\Desktop\agent_cross-session_mcp'

# Exa web search provider (free tier) - 2026-08-22. Key lives in ~/.dsh/.credentials.yaml (EXA_API_KEY), not in this file.
- insert:
    - id: web-search-exa
      name: '@deepseek-ai/dsh-web-search-exa'
      config:
        apiKey: 89593775-74fc-46e5-baab-c46b87178c07
        searchType: auto

# Pin Exa as the active search provider (deepseek + exa both registered - must pick one or WEB_PROVIDER_AMBIGUOUS).
- id: web
  config:
    searchProvider: exa

# 放宽附件图片限制（与 Vision Router bundle 同款 bytes/pixels，另加单边最大尺寸）。
# 官方 DeepSeek Vision API 支持单边最长 8192px（15+ 张图时 4096px），DSH 默认 2000px 太保守；
# 这里放宽到 4096，上大图不再撞「图片宽高不能超过2000px」。
# 注意：patch 是整个替换 row config，所以必须连同 bundle 层的 bytes/pixels 一起写。
- id: attachment-local
  config:
    maxImageBytes: 20971520
    maxImagePixels: 100000000
    maxImageDimension: 4096

