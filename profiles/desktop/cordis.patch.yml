# Your patch layer for this dsh profile, applied after every bundle layer:
# a top-level YAML array of loader patch entries (id-targeted config
# overrides, disables, and insert lists; `!!js` expressions allowed).
- id: ui-chat
  name: "@deepseek-ai/dsh-client-ui-chat"
  config:
    transcriptView: verbose
    performanceUsage: detailed
- id: ui-settings
  name: "@deepseek-ai/dsh-client-ui-settings"
  config:
    enabled: true
- id: ui-settings-account
  name: "@deepseek-ai/dsh-client-ui-settings-account"
  config:
    version: 1
    step: done
    usage: detailed
    developerTools: true
    purpose: null
    process: standard
    completion: api-key
- id: ui-theme
  name: "@deepseek-ai/dsh-client-ui-theme"
  config:
    preference: dark
- id: locale
  name: "@deepseek-ai/dsh-client-locale"
  config:
    preference: en
- id: permission
  name: "@deepseek-ai/dsh-permission-presets"
  config:
    presets:
      read-only:
        sandbox: read-only
        approval: ask
      workspace-write:
        sandbox: workspace-write
        approval: ask
      danger-full-access:
        sandbox: danger-full-access
        approval: never
    defaultPreset: danger-full-access
- id: ui-conversation
  name: "@deepseek-ai/dsh-client-ui-conversation"
  config:
    busyEnter: steer
- id: agent-preset-registry
  name: "@deepseek-ai/dsh-agent-preset-registry"
  config:
    default: standard
    selectedDefault: ptc
- id: agent-default-model
  name: "@deepseek-ai/dsh-agent-default-model"
  config:
    provider: deepseek-official
    model: deepseek-flash
    reasoningEffort: max

# ── 2026-10-02 · Ported from the web profile (additions, not a migration) ────────
# Each entry below was verified against dsh 0.2.0-rc.2 with DSH's own
# evaluatePluginCompatibility before installation; incompatible plugins were skipped.

# Keep plugin updates from terminating the active DSH host (same as the web profile).
- id: dsh-market
  name: dshmarket
  config:
    allowRestart: false

# Exa web search provider (free tier). Installed with:
#   dsh plugin --profile desktop add @deepseek-ai/dsh-web-search-exa@0.2.0-rc.2
# The web profile's pin 0.1.1-rc.2 is incompatible with dsh 0.2.0-rc.2.
# This package declares no dsh.bundle, so it only mounts through this insert.
- insert:
    - id: web-search-exa
      name: '@deepseek-ai/dsh-web-search-exa'
      config:
        apiKey: !!js process.env.EXA_API_KEY
        searchType: auto

# Pin Exa as the active search provider (deepseek + exa are both registered —
# one must be selected or web search fails with WEB_PROVIDER_AMBIGUOUS).
- id: web
  config:
    searchProvider: exa

# AWS MCP Server (Agent Toolkit for AWS) — read-only. Prereqs are the same as in the
# web profile: ~/.local/bin/mcp-proxy-for-aws.exe plus credentials in ~/.aws.
- insert:
    - id: mcp-aws
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: aws
        transport: stdio
        command: !!js process.env.USERPROFILE + '\\.local\\bin\\mcp-proxy-for-aws.exe'
        args:
          - https://aws-mcp.us-east-1.api.aws/mcp
          - --read-only
          - --metadata
          - AWS_REGION=us-east-1
        failOnStartupError: false
        reconnect:
          enabled: true
          maxAttempts: 5

# Cross-session awareness MCP server (skill: ~/.dsh/skills/cross-session).
- insert:
    - id: mcp-cross-session
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: crosssession
        transport: stdio
        command: node
        args: [ 'C:\\Users\\cheun\\.dsh\\repos\\agent_cross-session_mcp\\server.mjs' ]
        cwd: 'C:\\Users\\cheun\\.dsh\\repos\\agent_cross-session_mcp'
- id: subagent-model-selection-settings
  name: "@deepseek-ai/dsh-tool-subagent/model-selection-settings"
  config:
    enabled: true
    allowedModels:
      - provider: deepseek-account
        model: deepseek-flash
      - provider: deepseek-account
        model: deepseek-v4-pro
      - provider: deepseek-official
        model: deepseek-v4-pro
      - provider: deepseek-official
        model: deepseek-flash
- id: llm-deepseek-account
  name: "@deepseek-ai/dsh-llm-deepseek-account"
  config:
    models:
      - id: deepseek-flash
        name: DeepSeek-V4.1-Flash
        contextWindow: 1000000
        inputModalities:
          - text
          - image
        systemPromptUpdate: in-history
        toolUpdate: addition-only
      - id: deepseek-v4-pro
        name: DeepSeek-V4-Pro
        description: Stronger agentic coding, knowledge, and difficult reasoning; suited
          to complex or quality-critical tasks at higher cost.
        contextWindow: 1000000
        inputModalities:
          - text
- id: llm-deepseek
  name: "@deepseek-ai/dsh-llm-deepseek-api-key"
  config:
    models:
      - id: deepseek-flash
        name: DeepSeek-V4.1-Flash
        contextWindow: 1000000
        inputModalities:
          - text
          - image
        systemPromptUpdate: in-history
        toolUpdate: addition-only
      - id: deepseek-v4-pro
        name: DeepSeek-V4-Pro
        description: Stronger agentic coding, knowledge, and difficult reasoning; suited
          to complex or quality-critical tasks at higher cost.
        contextWindow: 1000000
        inputModalities:
          - text
