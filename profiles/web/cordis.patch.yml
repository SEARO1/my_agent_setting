# dsh-setup-bundle: portable profile patch for a fresh DSH install.
# Paths use !!js process.env.USERPROFILE so they work on any Windows machine.
# REQUIRED: put the knowledge folder at <USERPROFILE>\dsh-kb\knowledge
# (or edit the paths below / set KB_ROOT via env).
- id: attachment-local
  config:
    maxImageDimension: 4096
    maxImagePixels: 64000000
    maxImageBytes: 20971520

# Enable session full-text search (FTS) in the Web UI sidebar.
- id: session-query-sqlite
  config:
    path: !!js process.env.USERPROFILE + '\\.dsh\\storages\\session-fts.sqlite'
    openAt: first-search

# Knowledge base MCP server: REMOVED - MIGRATED to OpenViking (2026-08-22).
# Old KB + mcp-server kept in place (not deleted). Use mcp__openviking__* tools + openviking-memory skill.
# OpenViking server: ~/.openviking/start-ov.bat (port 1933), plugin @openviking/dsh-memory-plugin.

# Exa web search provider (free tier) - install: dsh plugin --profile web add @deepseek-ai/dsh-web-search-exa@0.1.1-rc.2
# (MUST pin @0.1.1-rc.2: npm 'latest' 0.0.1-rc.1 is broken - imports unpublished @deepseek-ai/dsh-environment)
# EXA_API_KEY lives in ~/.dsh/.credentials.yaml, never commit the real key here.
- insert:
    - id: web-search-exa
      name: '@deepseek-ai/dsh-web-search-exa'
      config:
        apiKey: !!js process.env.EXA_API_KEY
        searchType: auto

# Pin Exa as the active search provider (deepseek + exa both registered - must pick one or WEB_PROVIDER_AMBIGUOUS).
- id: web
  config:
    searchProvider: exa

# AWS MCP Server block: intentionally NOT mirrored here (machine-local).
# Live definition lives in ~/.dsh/profiles/web/cordis.patch.yml:
#   insert: mcp-aws -> ~/.local/bin/mcp-proxy-for-aws.exe, args [https://aws-mcp.us-east-1.api.aws/mcp, --read-only]
#   (uv-installed tool + AWS free-plan account, specific to this laptop)
# User decision 2026-09-15. Copy that block back when restoring this machine.

# Cross-session awareness MCP server: a DSH session can see what the other sessions on
# this machine are doing (peers / session_detail / announce / board / whoami / overlaps).
# Reads DSH session logs read-only (skill: ~/.dsh/skills/cross-session). serverName must stay
# 'crosssession' - caller identification matches mcp__crosssession__* records.
# Source repo: ~/.dsh/repos/agent_cross-session_mcp  (update = git -C that dir pull)
- insert:
    - id: mcp-cross-session
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: crosssession
        transport: stdio
        command: node
        args: [ 'C:\Users\cheun\.dsh\repos\agent_cross-session_mcp\server.mjs' ]
        cwd: 'C:\Users\cheun\.dsh\repos\agent_cross-session_mcp'

# Keep plugin updates from terminating the active DSH host. Changes that need
# a new boot remain pending until DSH is restarted manually.
- id: dsh-market
  name: dshmarket
  config:
    allowRestart: false
- id: ui-settings-general
  name: "@deepseek-ai/dsh-client-ui-settings-general"
  config:
    welcomeNoticeVersion: 2026-08-13.1
- id: locale
  name: "@deepseek-ai/dsh-client-locale"
  config:
    preference: en
- id: llm-pi-ai
  name: "@deepseek-ai/dsh-llm-pi-ai"
  config:
    providers:
      poe:
        apiKeyEnv: POE_API_KEY
        api: openai-completions
        baseURL: https://api.poe.com/v1
        models:
          - id: GPT-5.6-Sol
          - id: GPT-5.6-Terra
          - id: GPT-5.6-Luna
          - id: deepseek-vision-exp
            name: DeepSeek-Vision-Exp
            contextWindow: 1000000
            maxTokens: 384000
            reasoningEfforts:
              off: null
              high: high
              max: max
            compat:
              supportsReasoningEffort: true
              thinkingFormat: deepseek
          - id: deepseek-v4-pro
            name: DeepSeek-V4-Pro
            contextWindow: 1000000
            maxTokens: 384000
            reasoningEfforts:
              off: null
              high: high
              max: max
            compat:
              supportsReasoningEffort: true
              thinkingFormat: deepseek
          - id: deepseek-v4-flash
            name: DeepSeek-V4-Flash
            contextWindow: 1000000
            maxTokens: 384000
            reasoningEfforts:
              off: null
              high: high
              max: max
            compat:
              supportsReasoningEffort: true
              thinkingFormat: deepseek
          - id: kimi-k3
            name: Kimi-K3
      azure-openai-responses:
        apiKeyEnv: AZURE_OPENAI_API_KEY
        baseURL: https://veserveazureai.openai.azure.com/
        displayName: Azure GPT-5.6
        models:
          - id: gpt-5.6-sol
            name: GPT-5.6 Sol
            contextWindow: 1000000
            maxTokens: 128000
          - id: gpt-6-astra
            name: GPT-6 Astra
            contextWindow: 272000
            maxTokens: 128000
- id: agent-default-model
  name: "@deepseek-ai/dsh-agent-default-model"
  config:
    provider: deepseek-official
    model: deepseek-flash
    reasoningEffort: max
- id: ui-conversation
  name: "@deepseek-ai/dsh-client-ui-conversation"
  config:
    busyEnter: steer
- id: ui-theme
  name: "@deepseek-ai/dsh-client-ui-theme"
  config:
    preference: dark
- id: llm-deepseek
  name: "@deepseek-ai/dsh-llm-deepseek"
  config:
    models:
      - id: deepseek-flash
        name: DeepSeek-V4.1-Flash
        contextWindow: 1000000
        inputModalities:
          - text
          - image
        systemPromptUpdate: in-history

      - id: deepseek-v4-pro
        name: DeepSeek-V4-Pro
        description: Stronger agentic coding, knowledge, and difficult reasoning; suited
          to complex or quality-critical tasks at higher cost.
        contextWindow: 1000000
        inputModalities:
          - text

# OpenViking 0.3.2 uses the local PNPM patch under patches/ for DSH V4 producer
# kinds. Legacy source.kind: plugin messages remain readable during replay.
- id: subagent-model-selection-settings
  name: "@deepseek-ai/dsh-tool-subagent/model-selection-settings"
  config:
    enabled: true
    allowedModels:
      - provider: deepseek-official
        model: deepseek-flash
      - provider: deepseek-official
        model: deepseek-v4-pro
- id: agent-preset-registry
  name: "@deepseek-ai/dsh-agent-preset-registry"
  config:
    default: standard
    selectedDefault: ptc
- id: ui-chat
  name: "@deepseek-ai/dsh-client-ui-chat"
  config:
    transcriptView: expanded
- id: permission
  name: "@deepseek-ai/dsh-permission-presets"
  config:
    presets:
      read-only:
        sandbox: read-only
        approval: ask
      workspace-write:
        sandbox: workspace-write
        approval: ask
      danger-full-access:
        sandbox: danger-full-access
        approval: never
    defaultPreset: danger-full-access
- id: openviking-memory-runtime
  disabled: false
- id: openviking-memory
  disabled: false
- id: openviking-memory-runtime
  disabled: false

# ── 2026-09-24 · Sessions another process created get a Workspace home ──────────────
# The sidebar draws each Workspace's own sessionIds account, written only where a Session is
# CREATED (api-session-controller, webhook) — so a watcher's headless relay never became a
# member and sat under "Ungrouped". This row re-runs the registry's own attach path on a timer.
# Remove this block (keep the file) to go back. See PROGRESS.md "Open thread (2026-09-24)".
- insert:
    - id: session-workspace-attach
      name: './plugins/session-workspace-attach.js'
      config:
        intervalMs: 60000
        bootDelayMs: 5000
