# 喺另一部機度，將你嘅 key 填落呢度（或者喺 web Models 頁面填）
# DSH 主用 opencode-go（OPENCODE_GO_API_KEY）
OPENCODE_GO_API_KEY: sk-YOUR_KEY_HERE
# POE（agent-default-model 用 poe-vision / DeepSeek-V4-Flash）
POE_API_KEY: sk-poe-YOUR_KEY_HERE
# DeepSeek 官方（OpenViking VLM fallback 用）
DEEPSEEK_API_KEY: sk-YOUR_KEY_HERE
# Exa（DSH web_search provider，free tier）
EXA_API_KEY: YOUR_EXA_KEY_HERE
